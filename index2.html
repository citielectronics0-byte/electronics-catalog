<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CITY ELECTRONICS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Cloud Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-4 md:p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl font-bold text-slate-800">CITY ELECTRONICS</h1>
      <button onclick="showAdminLogin()" id="adminBtn" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-700">Admin Access</button>
    </header>

    <!-- Customer View -->
    <div id="customerView" class="space-y-6">
      <div class="bg-white p-3 rounded-xl shadow-sm flex flex-wrap gap-2" id="categoryTabs"></div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div id="catalog" class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        
        <div class="bg-white p-4 rounded-xl shadow-sm h-fit">
          <h2 class="text-lg font-semibold mb-3">Order Requirement</h2>
          <div id="cartItems" class="space-y-2 text-sm text-slate-600 mb-4">No items selected.</div>
          <form onsubmit="submitOrder(event)" class="space-y-3">
            <input type="text" id="custName" placeholder="Business / Customer Name" class="w-full border p-2 rounded text-sm" required />
            <input type="tel" id="custPhone" placeholder="Phone Number" class="w-full border p-2 rounded text-sm" required />
            <textarea id="custNotes" placeholder="Delivery Address / Special Notes" class="w-full border p-2 rounded text-sm" rows="2"></textarea>
            <div class="flex justify-between items-center pt-2 font-bold text-slate-800">
              <span>Grand Total:</span>
              <span id="cartTotal" class="text-blue-600 text-lg">₹0</span>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded-lg font-bold hover:bg-blue-700">Submit Order</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Admin View -->
    <div id="adminView" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-blue-50 border border-blue-200 p-4 rounded-xl">
        <h2 class="text-lg font-bold text-blue-900">Admin Control Panel</h2>
        <button onclick="logoutAdmin()" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-red-700">Logout Admin</button>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h3 id="formTitle" class="text-md font-semibold mb-3 text-slate-800">Add New Product</h3>
        <form id="productForm" onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <input type="hidden" id="editProductId" value="" />
          <input type="text" id="pName" placeholder="Item Name" class="border p-2 rounded text-sm" required />
          <select id="pCategory" class="border p-2 rounded text-sm" required>
            <option value="Cables">Cables</option>
            <option value="Connectors">Connectors</option>
            <option value="Remotes">Remotes</option>
            <option value="Components">Components</option>
            <option value="Computer Accessories">Computer Accessories</option>
          </select>
          <input type="number" id="pPrice" placeholder="Price (₹)" class="border p-2 rounded text-sm" required />
          <input type="url" id="pImage" placeholder="Image Direct Link (https://...)" class="border p-2 rounded text-sm" required />
          <input type="text" id="pDesc" placeholder="Description" class="border p-2 rounded text-sm md:col-span-3" required />
          <div class="flex gap-2 md:col-span-2">
            <button type="submit" id="saveBtn" class="w-full bg-green-600 text-white p-2 rounded text-sm font-semibold hover:bg-green-700">Add Item</button>
            <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden w-full bg-slate-400 text-white p-2 rounded text-sm font-semibold hover:bg-slate-500">Cancel</button>
          </div>
        </form>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h3 class="text-md font-semibold mb-3 text-slate-800">Manage Cloud Inventory</h3>
        <div id="adminInventory" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h3 class="text-md font-semibold mb-3 text-slate-800">Received Customer Orders</h3>
        <div id="ordersList" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Supabase Credentials ---
    const SUPABASE_URL = "https://pvbzxbtufpqzuckrzsbc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cA9ugur8vxwwHDf3AZW7fQ_DK0ld0al";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MASTER_ADMIN_PASSWORD = "1976";
    const categories = ["All", "Cables", "Connectors", "Remotes", "Components", "Computer Accessories"];
    const IMAGE_PLACEHOLDER = "https://placehold.co/400x300?text=No+Image+Available";

    let selectedCategory = "All";
    let products = [];
    let cart = [];

    // --- Load Products from Supabase Cloud ---
    async function loadProductsFromCloud() {
      const { data, error } = await _supabase.from('products').select('*').order('id', { ascending: true });
      if (!error && data) {
        products = data;
        renderCatalog();
        renderAdminInventory();
      }
    }

    // --- Render Category Navigation ---
    function renderCategoryTabs() {
      const tabsDiv = document.getElementById('categoryTabs');
      tabsDiv.innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      renderCategoryTabs();
      renderCatalog();
    }

    function renderCatalog() {
      const catalogDiv = document.getElementById('catalog');
      const filtered = selectedCategory === "All" ? products : products.filter(p => p.category === selectedCategory);

      if (filtered.length === 0) {
        catalogDiv.innerHTML = `<div class="col-span-2 text-slate-500 py-8 text-center bg-white rounded-xl">No items found.</div>`;
        return;
      }

      catalogDiv.innerHTML = filtered.map(p => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
          <div>
            <img src="${p.image}" alt="${p.name}" onerror="this.onerror=null; this.src='${IMAGE_PLACEHOLDER}';" class="w-full h-40 object-cover rounded-lg mb-2 bg-slate-100" />
            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">${p.category}</span>
            <h3 class="font-semibold text-slate-800 mt-1">${p.name}</h3>
            <p class="text-xs text-slate-500 mb-2">${p.description}</p>
            <p class="font-bold text-blue-600 mb-3">₹${p.price}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-1.5 rounded-lg text-sm font-medium">Add to Order</button>
        </div>
      `).join('');
    }

    // --- Cart Actions ---
    function addToCart(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;

      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...item, quantity: 1 });
      }
      renderCart();
    }

    function updateQuantity(id, change) {
      const item = cart.find(c => c.id === id);
      if (!item) return;
      item.quantity += change;
      if (item.quantity <= 0) cart = cart.filter(c => c.id !== id);
      renderCart();
    }

    function renderCart() {
      const cartDiv = document.getElementById('cartItems');
      const totalSpan = document.getElementById('cartTotal');

      if (cart.length === 0) {
        cartDiv.innerHTML = "No items selected.";
        totalSpan.innerText = "₹0";
        return;
      }

      let grandTotal = 0;
      cartDiv.innerHTML = cart.map(item => {
        const subtotal = item.price * item.quantity;
        grandTotal += subtotal;
        return `
          <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded border border-slate-200">
            <div>
              <div class="font-semibold text-xs">${item.name}</div>
              <div class="text-slate-500 text-xs">₹${item.price} x ${item.quantity} = ₹${subtotal}</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateQuantity(${item.id}, -1)" class="bg-slate-200 px-2 rounded font-bold">-</button>
              <span class="text-xs font-bold">${item.quantity}</span>
              <button onclick="updateQuantity(${item.id}, 1)" class="bg-slate-200 px-2 rounded font-bold">+</button>
            </div>
          </div>
        `;
      }).join('');

      totalSpan.innerText = `₹${grandTotal}`;
    }

    // --- Send Order to Supabase ---
    async function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) return alert("Select at least one item!");

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      const { error } = await _supabase.from('orders').insert([{
        customer_name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        notes: document.getElementById('custNotes').value,
        total_amount: total,
        items: cart
      }]);

      if (!error) {
        alert("Order submitted successfully!");
        cart = [];
        renderCart();
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custNotes').value = '';
      } else {
        alert("Failed to submit order. Check your network connection.");
      }
    }

    // --- Admin Operations ---
    function showAdminLogin() {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === MASTER_ADMIN_PASSWORD) {
        document.getElementById('customerView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        loadAdminOrders();
      } else if (pwd !== null) {
        alert("Incorrect password.");
      }
    }

    function logoutAdmin() {
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('customerView').classList.remove('hidden');
    }

    function renderAdminInventory() {
      const invDiv = document.getElementById('adminInventory');
      invDiv.innerHTML = products.map(p => `
        <div class="border p-3 rounded-lg bg-slate-50 flex flex-col justify-between">
          <div>
            <h4 class="font-bold text-slate-800">${p.name}</h4>
            <p class="text-xs text-slate-500">${p.category} | ₹${p.price}</p>
          </div>
          <div class="flex gap-2 mt-3">
            <button onclick="editProduct(${p.id})" class="w-full bg-blue-600 text-white text-xs py-1 rounded hover:bg-blue-700">Edit</button>
            <button onclick="deleteProduct(${p.id})" class="w-full bg-red-600 text-white text-xs py-1 rounded hover:bg-red-700">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function saveProduct(e) {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const payload = {
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        price: Number(document.getElementById('pPrice').value),
        image: document.getElementById('pImage').value,
        description: document.getElementById('pDesc').value
      };

      if (editId) {
        await _supabase.from('products').update(payload).eq('id', Number(editId));
      } else {
        await _supabase.from('products').insert([payload]);
      }

      resetForm();
      loadProductsFromCloud();
    }

    function editProduct(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;

      document.getElementById('editProductId').value = item.id;
      document.getElementById('pName').value = item.name;
      document.getElementById('pCategory').value = item.category;
      document.getElementById('pPrice').value = item.price;
      document.getElementById('pImage').value = item.image;
      document.getElementById('pDesc').value = item.description;

      document.getElementById('formTitle').innerText = "Edit Product";
      document.getElementById('saveBtn').innerText = "Update Item";
      document.getElementById('cancelEditBtn').classList.remove('hidden');
    }

    async function deleteProduct(id) {
      if (confirm("Delete product permanently?")) {
        await _supabase.from('products').delete().eq('id', id);
        loadProductsFromCloud();
      }
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('editProductId').value = "";
      document.getElementById('formTitle').innerText = "Add New Product";
      document.getElementById('saveBtn').innerText = "Add Item";
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    async function loadAdminOrders() {
      const { data, error } = await _supabase.from('orders').select('*').order('created_at', { ascending: false });
      const ordersDiv = document.getElementById('ordersList');
      if (error || !data || data.length === 0) {
        ordersDiv.innerHTML = "<p class='text-sm text-slate-500'>No orders found.</p>";
        return;
      }

      ordersDiv.innerHTML = data.map(order => `
        <div class="border p-4 rounded-lg bg-slate-50 space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <h4 class="font-bold text-slate-800">${order.customer_name} (${order.phone})</h4>
              <p class="text-xs text-slate-500">${new Date(order.created_at).toLocaleString()}</p>
              ${order.notes ? `<p class="text-xs text-slate-600 mt-1"><b>Notes:</b> ${order.notes}</p>` : ''}
            </div>
            <span class="font-bold text-blue-600">Total: ₹${order.total_amount}</span>
          </div>
          <div class="border-t pt-2 text-xs text-slate-700">
            <b>Ordered Items:</b>
            <ul class="list-disc list-inside mt-1">
              ${order.items.map(i => `<li>${i.name} - Qty: ${i.quantity} (₹${i.price * i.quantity})</li>`).join('')}
            </ul>
          </div>
        </div>
      `).join('');
    }

    // Init
    renderCategoryTabs();
    loadProductsFromCloud();
  </script>
</body>
</html>
