<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CITY ELECTRONICS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl font-bold text-slate-800">CITY ELECTRONICS</h1>
      <div id="adminNav">
        <button onclick="showAdminLogin()" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium">Admin Access</button>
      </div>
    </header>

    <!-- Customer View -->
    <div id="customerView" class="space-y-6">
      <!-- Category Tabs -->
      <div class="bg-white p-3 rounded-xl shadow-sm flex flex-wrap gap-2" id="categoryTabs"></div>

      <!-- Catalog & Order Form -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div id="catalog" class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        
        <div class="bg-white p-4 rounded-xl shadow-sm h-fit">
          <h2 class="text-lg font-semibold mb-3">Order Requirement</h2>
          <div id="cartItems" class="space-y-2 text-sm text-slate-600 mb-4">No items selected.</div>
          <form onsubmit="submitOrder(event)" class="space-y-3">
            <input type="text" id="custName" placeholder="Business / Customer Name" class="w-full border p-2 rounded text-sm" required />
            <input type="tel" id="custPhone" placeholder="Phone Number" class="w-full border p-2 rounded text-sm" required />
            <textarea id="custNotes" placeholder="Delivery Address / Special Notes" class="w-full border p-2 rounded text-sm" rows="2"></textarea>
            <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded-lg font-bold hover:bg-blue-700">Submit Order</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Admin View (Protected) -->
    <div id="adminView" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-blue-50 border border-blue-200 p-4 rounded-xl">
        <h2 class="text-lg font-bold text-blue-900">Admin Control Panel</h2>
        <div class="space-x-2">
          <button onclick="changePassword()" class="bg-slate-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium">Reset Password</button>
          <button onclick="logoutAdmin()" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium">Logout Admin</button>
        </div>
      </div>

      <!-- Add Product Section -->
      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h3 class="text-md font-semibold mb-3 text-slate-800">Add New Product to Website</h3>
        <form id="productForm" onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <input type="text" id="pName" placeholder="Item Name (e.g. HDMI Cable 1.5m)" class="border p-2 rounded text-sm" required />
          <select id="pCategory" class="border p-2 rounded text-sm" required>
            <option value="Cables">Cables</option>
            <option value="Connectors">Connectors</option>
            <option value="Remotes">Remotes</option>
            <option value="Components">Components</option>
            <option value="Computer Accessories">Computer Accessories</option>
          </select>
          <input type="number" id="pPrice" placeholder="Price (₹)" class="border p-2 rounded text-sm" required />
          <input type="url" id="pImage" placeholder="Image URL" class="border p-2 rounded text-sm" required />
          <input type="text" id="pDesc" placeholder="Description" class="border p-2 rounded text-sm md:col-span-4" required />
          <button type="submit" class="bg-green-600 text-white p-2 rounded text-sm font-semibold md:col-span-1">Add Item</button>
        </form>
      </div>

      <!-- Received Orders Section -->
      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h3 class="text-md font-semibold mb-3 text-slate-800">Received Customer Orders</h3>
        <div id="ordersList" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    const categories = ["All", "Cables", "Connectors", "Remotes", "Components", "Computer Accessories"];
    let selectedCategory = "All";

    let defaultProducts = [
      { id: 1, name: "HDMI Cable 1.5m 4K Ultra HD", category: "Cables", price: 150, image: "https://via.placeholder.com/150", desc: "High-speed 4K 60Hz braided HDMI cable" },
      { id: 2, name: "HDMI Cable 5m High Speed", category: "Cables", price: 380, image: "https://via.placeholder.com/150", desc: "Gold-plated connectors, heavy-duty shield" },
      { id: 3, name: "CAT6 Ethernet Cable 305m", category: "Cables", price: 4500, image: "https://via.placeholder.com/150", desc: "Pure copper high speed network cable" },
      { id: 4, name: "Universal TV Remote", category: "Remotes", price: 120, image: "https://via.placeholder.com/150", desc: "Compatible with LG, Samsung, Sony LED TVs" }
    ];

    let products = JSON.parse(localStorage.getItem('products')) || defaultProducts;
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    let cart = [];

    // --- Customer Functions ---
    function renderCategoryTabs() {
      const tabsDiv = document.getElementById('categoryTabs');
      tabsDiv.innerHTML = categories.map(cat => `
        <button 
          onclick="filterCategory('${cat}')" 
          class="px-4 py-2 rounded-lg text-sm font-semibold transition ${
            selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      renderCategoryTabs();
      renderCatalog();
    }

    function renderCatalog() {
      const catalogDiv = document.getElementById('catalog');
      const filtered = selectedCategory === "All" ? products : products.filter(p => p.category === selectedCategory);

      if (filtered.length === 0) {
        catalogDiv.innerHTML = `<div class="col-span-2 text-slate-500 py-8 text-center bg-white rounded-xl">No items found in <b>${selectedCategory}</b>.</div>`;
        return;
      }

      catalogDiv.innerHTML = filtered.map(p => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
          <div>
            <img src="${p.image}" class="w-full h-32 object-cover rounded-lg mb-2" />
            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">${p.category}</span>
            <h3 class="font-semibold text-slate-800 mt-1">${p.name}</h3>
            <p class="text-xs text-slate-500 mb-2">${p.desc}</p>
            <p class="font-bold text-blue-600 mb-3">₹${p.price}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-1.5 rounded-lg text-sm font-medium">Add to Order</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      renderCart();
    }

    function renderCart() {
      const cartDiv = document.getElementById('cartItems');
      if (cart.length === 0) {
        cartDiv.innerHTML = "No items selected.";
        return;
      }
      cartDiv.innerHTML = cart.map((item, idx) => `
        <div class="flex justify-between items-center bg-slate-50 p-2 rounded">
          <span>${item.name} (₹${item.price})</span>
          <button onclick="cart.splice(${idx}, 1); renderCart();" class="text-red-500 font-bold">×</button>
        </div>
      `).join('');
    }

    function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) return alert("Please select at least one item!");
      
      const newOrder = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        customerName: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        notes: document.getElementById('custNotes').value,
        items: [...cart],
        total: cart.reduce((sum, item) => sum + item.price, 0)
      };

      orders.unshift(newOrder);
      localStorage.setItem('orders', JSON.stringify(orders));

      cart = [];
      renderCart();
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custNotes').value = '';
      alert("Your order has been submitted successfully! The team will process it shortly.");
    }

    // --- Dynamic Admin Authentication ---
    function showAdminLogin() {
      let savedPassword = localStorage.getItem('admin_password');

      // First time setup prompt
      if (!savedPassword) {
        const newPwd = prompt("First Time Setup: Set your new Admin Password:");
        if (newPwd && newPwd.trim() !== '') {
          localStorage.setItem('admin_password', newPwd.trim());
          alert("Password created successfully! Please re-enter it to log in.");
        } else {
          alert("Password setup cancelled.");
          return;
        }
      }

      // Login prompt
      savedPassword = localStorage.getItem('admin_password');
      const enteredPwd = prompt("Enter Admin Password:");
      
      if (enteredPwd === savedPassword) {
        document.getElementById('customerView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        renderAdminOrders();
      } else if (enteredPwd !== null) {
        alert("Incorrect Admin Password.");
      }
    }

    function changePassword() {
      const currentPwd = prompt("Enter Current Password:");
      const savedPassword = localStorage.getItem('admin_password');
      
      if (currentPwd === savedPassword) {
        const newPwd = prompt("Enter New Password:");
        if (newPwd && newPwd.trim() !== '') {
          localStorage.setItem('admin_password', newPwd.trim());
          alert("Password changed successfully!");
        }
      } else {
        alert("Incorrect current password.");
      }
    }

    function logoutAdmin() {
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('customerView').classList.remove('hidden');
    }

    function saveProduct(e) {
      e.preventDefault();
      const newProd = {
        id: Date.now(),
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        price: Number(document.getElementById('pPrice').value),
        image: document.getElementById('pImage').value,
        desc: document.getElementById('pDesc').value
      };
      products.push(newProd);
      localStorage.setItem('products', JSON.stringify(products));
      renderCatalog();
      document.getElementById('productForm').reset();
      alert("Product added successfully!");
    }

    function renderAdminOrders() {
      const ordersDiv = document.getElementById('ordersList');
      if (orders.length === 0) {
        ordersDiv.innerHTML = "<p class='text-sm text-slate-500'>No orders received yet.</p>";
        return;
      }

      ordersDiv.innerHTML = orders.map(order => `
        <div class="border border-slate-200 p-4 rounded-lg bg-slate-50 space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <h4 class="font-bold text-slate-800">${order.customerName} (${order.phone})</h4>
              <p class="text-xs text-slate-500">Date: ${order.date}</p>
              ${order.notes ? `<p class="text-xs text-slate-600 mt-1"><b>Notes/Address:</b> ${order.notes}</p>` : ''}
            </div>
            <span class="font-bold text-blue-600">Total: ₹${order.total}</span>
          </div>
          <div class="border-t border-slate-200 pt-2 text-xs text-slate-700">
            <b>Ordered Items:</b>
            <ul class="list-disc list-inside mt-1">
              ${order.items.map(item => `<li>${item.name} - ₹${item.price}</li>`).join('')}
            </ul>
          </div>
        </div>
      `).join('');
    }

    // Initialize UI
    renderCategoryTabs();
    renderCatalog();
  </script>
</body>
</html>
